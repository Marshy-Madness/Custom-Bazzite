---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: custom-bazzite
description: Custom Bazzite desktop image with Waydroid and personal config.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  # Drop config files into the image.
  # Place files under files/system/ mirroring the root filesystem.
  # e.g. files/system/etc/sysctl.d/99-custom.conf → /etc/sysctl.d/99-custom.conf
  - type: files
    files:
      - source: system
        destination: /

  # Extra RPM packages via dnf/rpm-ostree
  - type: dnf
    install:
      packages:
        - waydroid
        # Add more packages here, e.g.:
        # - distrobox
        # - input-remapper
        # - v4l2loopback

  # Systemd units — enable waydroid services
  - type: systemd
    system:
      enabled:
        - waydroid-container.service
        - waydroid-init.service  # first-boot init (defined in files/system)

  # Default Flatpaks installed at first boot
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        # repo-url and repo-name default to Flathub if omitted
        install:
          # Add your Flatpaks here, e.g.:
          # - com.obsproject.Studio
          # - org.videolan.VLC
          # - net.davidotek.pupgui2
          # - com.github.tchx84.Flatseal
        remove:
          # Remove unwanted pre-installed Flatpaks here, e.g.:
          # - org.gnome.Maps
      - scope: user  # adds Flathub user repo

  - type: signing
